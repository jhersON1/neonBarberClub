name: Build and deploy to GitHub Pages

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test:ci

      - name: Build static site
        run: pnpm build

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.NEONBARBERTOKEN }}
        run: pnpm exec ng deploy --base-href=/ --name="jhersON1" --email="rodriguezpaul98@gmail.com" --cname=neonbarberclub.com
