<div class="min-h-screen bg-white">

  <app-navbar></app-navbar>

  <section id="inicio" class="w-full">
    <app-hero-video></app-hero-video>
  </section>

  <!-- Services -->
  <section id="servicios" class="bg-white py-12 sm:py-16 md:py-14 lg:py-16 xl:py-20 2xl:py-24 px-4 sm:px-6 lg:px-8" aria-labelledby="servicios-heading">
    <div class="container mx-auto max-w-[1400px]">
      <h2 id="servicios-heading"
        class="text-xl sm:text-2xl md:text-xl lg:text-2xl xl:text-3xl 2xl:text-4xl font-light text-center mb-8 sm:mb-12 md:mb-10 lg:mb-12 xl:mb-16 tracking-wider">
        SERVICIOS</h2>

      <div
        class="grid grid-cols-1 sm:grid-cols-2 gap-6 sm:gap-8 md:gap-8 lg:gap-12 xl:gap-16 max-w-4xl mx-auto">

        <article class="space-y-3 sm:space-y-4 md:space-y-3 lg:space-y-4 text-center" itemscope itemtype="https://schema.org/Service">
          <div class="aspect-[4/5] bg-gray-50 relative overflow-hidden">
            <img src="corte.png" 
                 alt="Corte de cabello profesional en Neon Barber Club Santa Cruz - Estilo moderno y técnicas tradicionales" 
                 title="Corte de cabello - 40Bs"
                 loading="lazy"
                 decoding="async"
                 width="300"
                 height="375"
                 class="w-full h-full object-cover absolute inset-0"
                 itemprop="image">
          </div>
          <h3 class="text-base sm:text-lg md:text-base lg:text-lg xl:text-xl 2xl:text-2xl font-light tracking-wide" itemprop="name">
            CORTE</h3>
          <p class="text-sm md:text-xs lg:text-sm xl:text-base text-gray-600" itemprop="offers" itemscope itemtype="https://schema.org/Offer">
            <span itemprop="price">40</span><span itemprop="priceCurrency" content="BOB">Bs</span>
          </p>
        </article>

        <article class="space-y-3 sm:space-y-4 md:space-y-3 lg:space-y-4 text-center" itemscope itemtype="https://schema.org/Service">
          <div class="aspect-[4/5] bg-gray-50 relative overflow-hidden">
            <img src="barba.png" 
                 alt="Arreglo de barba y cejas en Neon Barber Club Santa Cruz - Precisión y estilo profesional" 
                 title="Barba y Ceja - 20Bs"
                 loading="lazy"
                 decoding="async"
                 width="300"
                 height="375"
                 class="w-full h-full object-cover absolute inset-0"
                 itemprop="image">
          </div>
          <h3 class="text-base sm:text-lg md:text-base lg:text-lg xl:text-xl 2xl:text-2xl font-light tracking-wide" itemprop="name">
            BARBA Y CEJA</h3>
          <p class="text-sm md:text-xs lg:text-sm xl:text-base text-gray-600" itemprop="offers" itemscope itemtype="https://schema.org/Offer">
            <span itemprop="price">20</span><span itemprop="priceCurrency" content="BOB">Bs</span>
          </p>
        </article>
      </div>
    </div>
  </section>

  <!-- Features -->
  <section class="py-12 sm:py-16 md:py-14 lg:py-16 xl:py-20 2xl:py-24 px-4 sm:px-6 lg:px-8 bg-black text-white">
    <div class="container mx-auto max-w-[1400px]">
      <div class="grid md:grid-cols-2 gap-8 sm:gap-12 md:gap-8 lg:gap-10 xl:gap-16 items-center max-w-6xl mx-auto">
        <div class="max-w-xl">
          <h2
            class="text-xl sm:text-2xl md:text-xl lg:text-2xl xl:text-3xl 2xl:text-4xl font-light mb-4 sm:mb-6 md:mb-4 lg:mb-6 xl:mb-8 tracking-wider">
            EXPERIENCIA ÚNICA</h2>
          <div class="space-y-4 sm:space-y-6 md:space-y-3 lg:space-y-4 xl:space-y-6 text-gray-300">
            <p class="text-sm sm:text-base md:text-xs lg:text-sm xl:text-base 2xl:text-lg">En Neon Barber Club combinamos técnicas tradicionales de barbería con un ambiente moderno y exclusivo. Cada corte es una obra de arte personalizada para realzar tu estilo único.</p>
            <button
              (click)="scrollToSection('servicios')"
              class="w-full sm:w-auto px-6 sm:px-8 py-3 md:px-5 md:py-2.5 lg:px-6 lg:py-3 xl:px-8 xl:py-4 2xl:px-10 2xl:py-5 border border-white hover:bg-white hover:text-black transition-all mt-4 sm:mt-6 md:mt-4 lg:mt-6 xl:mt-8 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-black">
              CONOCE MÁS
            </button>
          </div>
        </div>
        <div class="aspect-square sm:aspect-[4/3] md:aspect-square bg-gray-900 mt-8 md:mt-0 relative overflow-hidden">
          <img src="neonBarberBackground.jpg" 
               alt="Interior moderno de Neon Barber Club en Santa Cruz - Ambiente exclusivo con iluminación neón" 
               title="Interior Neon Barber Club - Experiencia única en barbería"
               loading="lazy"
               decoding="async"
               width="400"
               height="400"
               class="w-full h-full object-cover absolute inset-0">
        </div>
      </div>
    </div>
  </section>

  <section id="reservar" class="py-12 sm:py-16 md:py-20 lg:py-24 px-4 sm:px-6 lg:px-8 bg-white">
    <app-booking></app-booking>
  </section>

  <section id="ubicacion" class="py-12 sm:py-16 md:py-20 lg:py-24 px-4 sm:px-6 lg:px-8 bg-gray-50">
    <app-location></app-location>
  </section>

  <footer class="py-12 sm:py-16 md:py-20 px-4 sm:px-6 lg:px-8 bg-white border-t border-black/5">
    <app-footer></app-footer>
  </footer>
</div>
