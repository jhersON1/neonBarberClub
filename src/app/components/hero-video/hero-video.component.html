<div class="relative w-full">
    <div class="md:hidden h-[calc(100vh-80px)] sm:h-[calc(100vh-96px)] bg-white">
        <video #mobileVideo 
               playsinline 
               autoplay 
               loop 
               muted 
               preload="metadata"
               fetchpriority="high"
               aria-label="Video promocional de Neon Barber Club mostrando cortes profesionales"
               class="w-full h-full object-cover"
               (error)="onVideoError($event)">
            <source src="baber-hero.mp4" type="video/mp4">
            <p>Tu navegador no soporta videos HTML5. <a href="baber-hero.mp4">Descargar video</a>.</p>
        </video>
    </div>
    
    <div class="hidden md:block 4xl:hidden bg-white">
        <video #desktopVideo 
               playsinline 
               autoplay 
               loop 
               muted 
               preload="metadata"
               fetchpriority="high"
               aria-label="Video promocional de Neon Barber Club mostrando cortes profesionales"
               class="w-full"
               (error)="onVideoError($event)">
            <source src="baber-hero.mp4" type="video/mp4">
            <p>Tu navegador no soporta videos HTML5. <a href="baber-hero.mp4">Descargar video</a>.</p>
        </video>
    </div>
    
    <div class="hidden 4xl:block bg-white">
        <video #ultrawideVideo 
               playsinline 
               autoplay 
               loop 
               muted 
               preload="metadata"
               fetchpriority="high"
               aria-label="Video promocional de Neon Barber Club mostrando cortes profesionales"
               class="w-full max-w-screen-3xl mx-auto"
               (error)="onVideoError($event)">
            <source src="baber-hero.mp4" type="video/mp4">
            <p>Tu navegador no soporta videos HTML5. <a href="baber-hero.mp4">Descargar video</a>.</p>
        </video>
    </div>

    <div class="absolute inset-0 flex items-end md:items-start p-4 md:p-8 lg:p-12 2xl:p-16 4xl:p-24">
        <div class="inline-flex flex-col md:w-1/2 2xl:w-1/3 md:pt-20 lg:pt-24">
            <h1 class="text-[#fbfbfb] text-3xl md:text-2xl lg:text-3xl xl:text-4xl 2xl:text-6xl 4xl:text-7xl font-light tracking-wider">
                ELEVA TU PRESENCIA
            </h1>
            <div class="font-sans mt-6 md:mt-6 lg:mt-8 2xl:mt-10 4xl:mt-12 text-[#fbfbfb] text-sm md:text-xs lg:text-sm xl:text-base 2xl:text-lg 4xl:text-xl max-w-3xl">
                <p>Cortes que marcan la diferencia, encuentra tu estilo</p>
            </div>
            <div class="mt-6 md:mt-8 lg:mt-10 xl:mt-12 2xl:mt-16 4xl:mt-20 flex gap-3 flex-wrap items-start">
                <button (click)="scrollToSection('reservar')" 
                        class="px-6 py-3 md:px-6 md:py-3 lg:px-8 lg:py-4 2xl:px-10 2xl:py-5 4xl:text-xl bg-white text-black hover:bg-white/90 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-white"
                        aria-label="Reservar cita en Neon Barber Club">
                    RESERVA
                </button>
                <button (click)="scrollToSection('servicios')" 
                        class="px-6 py-3 md:px-6 md:py-3 lg:px-8 lg:py-4 2xl:px-10 2xl:py-5 4xl:text-xl border border-white text-white hover:bg-white hover:text-black transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-white"
                        aria-label="Ver servicios de Neon Barber Club">
                    SERVICIOS
                </button>
            </div>
        </div>
    </div>
</div>
