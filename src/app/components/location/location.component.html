<div class="max-w-6xl mx-auto">
    <h2 class="text-xl sm:text-2xl md:text-xl lg:text-2xl xl:text-3xl 2xl:text-4xl font-light text-center mb-8 sm:mb-12 md:mb-10 lg:mb-12 xl:mb-16 tracking-wider">VISÍTANOS
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-5 gap-8 md:gap-8 lg:gap-12">
        <div class="md:col-span-2 space-y-6 md:space-y-4 lg:space-y-6 xl:space-y-8">
            <div class="space-y-3 md:space-y-2 lg:space-y-3 xl:space-y-4">
                <h3 class="text-lg sm:text-xl md:text-lg lg:text-xl 2xl:text-2xl font-light">NEON BARBER CLUB</h3>
                <p class="text-sm md:text-xs lg:text-sm xl:text-base text-gray-600">Tu barbería de confianza en Santa Cruz de la Sierra.</p>
            </div>

            <!-- Location details -->
            <div class="space-y-4 md:space-y-3 lg:space-y-4 xl:space-y-6">
                <div class="space-y-2">
                    <h4 class="text-base md:text-sm lg:text-base xl:text-lg font-medium">DIRECCIÓN</h4>
                    <p class="text-sm md:text-xs lg:text-sm xl:text-base text-gray-600">
                        {{ business.address.street }}<br>
                        {{ business.address.locality }}<br>
                    </p>
                </div>

                <div class="space-y-2">
                    <h4 class="text-base md:text-sm lg:text-base xl:text-lg font-medium">HORARIOS</h4>
                    <div class="text-sm md:text-xs lg:text-sm xl:text-base text-gray-600 space-y-1">
                        <p>{{ business.openingHours.display }}</p>
                    </div>
                </div>

                <div class="space-y-2">
                    <h4 class="text-base md:text-sm lg:text-base xl:text-lg font-medium">CONTACTO</h4>
                    <div class="text-sm md:text-xs lg:text-sm xl:text-base text-gray-600 space-y-1">
                        <p><a [href]="links.phone" class="hover:text-neon-blue-500 transition-colors">{{ business.phone.display }}</a></p>
                    </div>
                </div>

                <a
                    [href]="business.googleMapsUrl"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="w-full sm:w-auto px-6 md:px-5 lg:px-6 xl:px-8 py-3 md:py-2.5 lg:py-3 xl:py-4 bg-black text-white hover:bg-gray-800 transition-all text-sm md:text-xs lg:text-sm xl:text-base focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2">
                    OBTENER DIRECCIÓN
                </a>
            </div>
        </div>

        <div class="md:col-span-3 aspect-video bg-gray-100 rounded-lg shadow-sm overflow-hidden">
            <iframe 
                [src]="mapUrl" 
                width="100%" 
                height="100%" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade"
                class="rounded-lg"
                title="Mapa de ubicación de Neon Barber Club en Santa Cruz de la Sierra">
            </iframe>
        </div>
    </div>
</div>
