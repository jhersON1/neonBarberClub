<!-- Loading skeleton -->
@if (isLoading()) {
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-2xl mx-auto">
    @for (i of [1, 2]; track i) {
      <div class="animate-pulse bg-gray-50 rounded-none h-36"></div>
    }
  </div>
}

<!-- Error state -->
@else if (error()) {
  <div class="text-center py-12">
    <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-4">
      <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
      </svg>
    </div>
    <p class="text-gray-400 text-sm mb-5">{{ error() }}</p>
    <button
      (click)="retryRequested.emit()"
      class="px-6 py-2.5 border border-gray-200 text-xs tracking-[0.12em] rounded-none hover:border-black hover:bg-black hover:text-white transition-all duration-300"
    >REINTENTAR</button>
  </div>
}

<!-- Barber cards -->
@else {
  <p class="text-center text-gray-400 text-xs sm:text-sm mb-8 tracking-wider font-light">
    Elige tu barbero de preferencia
  </p>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-2xl mx-auto">
    @for (barber of barbers(); track barber.id) {
      <button
        type="button"
        (click)="onSelect(barber)"
        class="group relative text-left p-5 sm:p-6 rounded-none border transition-all duration-300 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-black/10 focus:ring-offset-2"
        [class.border-black]="selectedBarber()?.id === barber.id"
        [class.shadow-md]="selectedBarber()?.id === barber.id"
        [class.border-gray-100]="selectedBarber()?.id !== barber.id"
        [class.hover:border-gray-300]="selectedBarber()?.id !== barber.id"
      >
        <!-- Selected indicator -->
        @if (selectedBarber()?.id === barber.id) {
          <div class="absolute top-4 right-4 w-6 h-6 rounded-full bg-black text-white flex items-center justify-center">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </div>
        }

        <!-- Avatar + Name -->
        <div class="flex items-center gap-4 mb-4">
          <div
            class="w-12 h-12 rounded-full flex items-center justify-center text-base font-medium transition-all duration-300"
            [class.bg-black]="selectedBarber()?.id === barber.id"
            [class.text-white]="selectedBarber()?.id === barber.id"
            [class.bg-gray-100]="selectedBarber()?.id !== barber.id"
            [class.text-gray-500]="selectedBarber()?.id !== barber.id"
          >
            {{ barber.name.charAt(0) | uppercase }}
          </div>
          <h4 class="text-sm sm:text-[15px] font-medium tracking-[0.08em]">
            {{ barber.name | uppercase }}
          </h4>
        </div>

        <!-- Schedule -->
        <div class="flex items-center gap-2 pt-3 border-t border-gray-100">
          <svg class="w-3.5 h-3.5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span class="text-[11px] tracking-wider text-gray-400 font-light">
            {{ barber.schedule.startTime }} – {{ barber.schedule.endTime }}
          </span>
        </div>
      </button>
    }
  </div>
}
