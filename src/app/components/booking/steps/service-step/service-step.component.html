<!-- Loading skeleton -->
@if (isLoading()) {
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-2xl mx-auto">
    @for (i of [1, 2, 3]; track i) {
      <div class="animate-pulse bg-gray-50 rounded-2xl h-36"></div>
    }
  </div>
}

<!-- Error state -->
@else if (error()) {
  <div class="text-center py-12">
    <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-4">
      <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
      </svg>
    </div>
    <p class="text-gray-400 text-sm mb-5">{{ error() }}</p>
    <button
      (click)="retryRequested.emit()"
      class="px-6 py-2.5 border border-gray-200 text-xs tracking-[0.12em] rounded-xl hover:border-black hover:bg-black hover:text-white transition-all duration-300"
    >REINTENTAR</button>
  </div>
}

<!-- Service cards -->
@else {
  <p class="text-center text-gray-400 text-xs sm:text-sm mb-8 tracking-wider font-light">
    Selecciona el servicio que deseas
  </p>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-2xl mx-auto">
    @for (service of services(); track service.id) {
      <button
        type="button"
        (click)="onSelect(service)"
        class="group relative text-left p-5 sm:p-6 rounded-2xl border transition-all duration-300 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-black/10 focus:ring-offset-2"
        [class.border-black]="selectedService()?.id === service.id"
        [class.shadow-md]="selectedService()?.id === service.id"
        [class.border-gray-100]="selectedService()?.id !== service.id"
        [class.hover:border-gray-300]="selectedService()?.id !== service.id"
      >
        <!-- Selected indicator -->
        @if (selectedService()?.id === service.id) {
          <div class="absolute top-4 right-4 w-6 h-6 rounded-full bg-black text-white flex items-center justify-center">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </div>
        }

        <!-- Service name -->
        <h4 class="text-sm sm:text-[15px] font-medium tracking-[0.08em] mb-1.5">
          {{ service.name | uppercase }}
        </h4>

        <!-- Description -->
        <p class="text-xs text-gray-400 mb-4 leading-relaxed font-light">
          {{ service.description }}
        </p>

        <!-- Price & duration row -->
        <div class="flex items-center justify-between pt-3 border-t border-gray-100">
          <span class="text-lg sm:text-xl font-light tracking-tight">{{ service.price }} Bs</span>
          <span class="text-[10px] tracking-[0.15em] text-gray-400 font-medium">{{ service.durationInMinutes }} MIN</span>
        </div>
      </button>
    }
  </div>
}
